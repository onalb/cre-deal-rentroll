name: deploy-apprunner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        id: ecr
      - name: Build and push
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: cre-deal-rentroll
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker build -f deploy/Dockerfile -t "$IMAGE" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Create or update CloudFormation
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.OPENAI_API_KEY != '' }}
        run: |
          aws cloudformation deploy \
            --stack-name cre-deal-rentroll \
            --template-file deploy/cloudformation.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ImageUri="$IMAGE" OpenAIApiKey="${{ secrets.OPENAI_API_KEY }}" TableName=ml_interview
          aws cloudformation describe-stacks --stack-name cre-deal-rentroll \
            --query "Stacks[0].Outputs" --output table

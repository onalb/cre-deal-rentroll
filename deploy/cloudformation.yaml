AWSTemplateFormatVersion: "2010-09-09"
Description: CRE Deal Rentroll — DynamoDB + App Runner (UI+API). AgentCore dashboard/filters already exist out of band.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI (account.dkr.ecr.region.amazonaws.com/cre-deal-rentroll:tag)
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key for Strands / ReAct
  TableName:
    Type: String
    Default: ml_interview
  AgentCoreLogGroup:
    Type: String
    Default: /aws/bedrock-agentcore/runtimes/cre_deal_rentroll-Nh63z6GXmK-DEFAULT
    Description: AgentCore runtime log group (all microVM streams). Dashboard queries this, not App Runner.
  AgentCoreRuntimeArn:
    Type: String
    Default: arn:aws:bedrock-agentcore:us-east-1:226721156429:runtime/cre_deal_rentroll-Nh63z6GXmK
    Description: AgentCore Runtime ARN for App Runner chat invoke. Keep set so a stack update does not drop AGENTCORE_RUNTIME_ARN.

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dynamo-ml-interview
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:CreateTable
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  - bedrock-agentcore:InvokeAgentRuntimeForUser
                Resource:
                  - !Ref AgentCoreRuntimeArn
                  - !Sub "${AgentCoreRuntimeArn}/runtime-endpoint/*"

  AccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: cre-deal-rentroll
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AccessRole.Arn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: DDB_TABLE
                Value: !Ref TableName
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: OPENAI_API_KEY
                Value: !Ref OpenAIApiKey
              - Name: AGENTCORE_RUNTIME_ARN
                Value: !Ref AgentCoreRuntimeArn
      InstanceConfiguration:
        Cpu: "1 vCPU"
        Memory: "2 GB"
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /api/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  ServiceUrl:
    Value: !Sub https://${Service.ServiceUrl}
  TableNameOut:
    Value: !Ref Table
  AgentCoreDashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=cre-deal-rentroll-agentcore
  AgentCoreLogGroupOut:
    Value: !Ref AgentCoreLogGroup

[project]
name = "cre-deal-rentroll"
version = "0.1.0"
description = "CRE rent-roll ingest + agent harness with tools, MCP-style vault, and G/C/R eval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
agent = ["strands-agents>=1.0"]

[project.scripts]
cre-rentroll = "cre_rentroll.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
